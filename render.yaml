services:
  - type: web
    name: sceneplay-relay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn relay.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RELAY_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./relay.db
